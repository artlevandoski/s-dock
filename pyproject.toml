[project]
name = "switchyard"
version = "0.1.0"
description = "Independent Windows frontend for Switch 1 and Switch 2 game libraries"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8"]

[project.gui-scripts]
switchyard = "switchyard.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
